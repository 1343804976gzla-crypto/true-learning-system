services:
  app:
    environment:
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-true}"
      UVICORN_FORWARDED_ALLOW_IPS: "${UVICORN_FORWARDED_ALLOW_IPS:-*}"
    command:
      [
        "/bin/sh",
        "-lc",
        "/usr/local/bin/python -m uvicorn main:app --host 0.0.0.0 --port 8000 --no-access-log --proxy-headers --forwarded-allow-ips='${UVICORN_FORWARDED_ALLOW_IPS:-*}'",
      ]

  caddy:
    image: caddy:2.8
    container_name: true-learning-system-caddy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${TLS_PROXY_BIND_HOST:-0.0.0.0}:${TLS_PROXY_HTTP_PORT:-80}:80"
      - "${TLS_PROXY_BIND_HOST:-0.0.0.0}:${TLS_PROXY_HTTPS_PORT:-443}:443"
    environment:
      TLS_PUBLIC_HOSTNAME: "${TLS_PUBLIC_HOSTNAME:-localhost}"
      TLS_MAX_REQUEST_BODY: "${TLS_MAX_REQUEST_BODY:-32MB}"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
