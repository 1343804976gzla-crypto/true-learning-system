services:
  postgres:
    image: postgres:16
    container_name: true-learning-system-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-true_learning_system}"
      POSTGRES_USER: "${POSTGRES_USER:-tls}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-me}"
      TZ: "Asia/Shanghai"
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-tls} -d ${POSTGRES_DB:-true_learning_system}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  neo4j:
    image: neo4j:5.26.2
    container_name: true-learning-system-neo4j
    restart: unless-stopped
    ports:
      - "${GRAPHITI_NEO4J_BIND_HOST:-127.0.0.1}:${GRAPHITI_NEO4J_HTTP_PORT:-7474}:7474"
      - "${GRAPHITI_NEO4J_BIND_HOST:-127.0.0.1}:${GRAPHITI_NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "${GRAPHITI_NEO4J_USER:-neo4j}/${GRAPHITI_NEO4J_PASSWORD:-password}"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:7474 >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: true-learning-system-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-tls}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-true_learning_system}"
      ALEMBIC_DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-tls}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-true_learning_system}"
      CORE_DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-tls}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-true_learning_system}"
      CONTENT_DATABASE_PATH: ""
      CONTENT_DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-tls}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-true_learning_system}"
      LEGACY_DATABASE_PATH: ""
      LEGACY_DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-tls}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-true_learning_system}"
      AGENT_DATABASE_PATH: ""
      AGENT_DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-tls}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-true_learning_system}"
      RUNTIME_DATABASE_PATH: ""
      RUNTIME_DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-tls}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-true_learning_system}"
      REVIEW_DATABASE_PATH: ""
      REVIEW_DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-tls}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-true_learning_system}"
      DB_AUTO_CREATE_SCHEMA: "false"
      SINGLE_USER_MODE: "${SINGLE_USER_MODE:-false}"
      TZ: "Asia/Shanghai"
    command: ["/bin/sh", "-lc", "alembic upgrade head"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: true-learning-system
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${TLS_APP_BIND_HOST:-127.0.0.1}:${TLS_PORT:-18000}:8000"
    env_file:
      - .env
    environment:
      SINGLE_USER_MODE: "${SINGLE_USER_MODE:-false}"
      DB_AUTO_CREATE_SCHEMA: "${DB_AUTO_CREATE_SCHEMA:-false}"
      TLS_RELOAD: "0"
      OPENVIKING_ENABLED: "false"
      OPENVIKING_SYNC_ENABLED: "false"
      AGENT_MARKDOWN_MEMORY_ROOT: "/app/memory/runtime"
      TELEGRAM_POLLING_ENABLED: "false"
      TELEGRAM_ALLOW_NON_DOCKER_POLLING: "${TELEGRAM_ALLOW_NON_DOCKER_POLLING:-false}"
      GRAPHITI_ENABLED: "${GRAPHITI_ENABLED:-true}"
      GRAPHITI_NEO4J_URI: "bolt://neo4j:7687"
      GRAPHITI_NEO4J_USER: "${GRAPHITI_NEO4J_USER:-neo4j}"
      GRAPHITI_NEO4J_PASSWORD: "${GRAPHITI_NEO4J_PASSWORD:-password}"
      GRAPHITI_LLM_BASE_URL: "${GRAPHITI_LLM_BASE_URL:-https://api.deepseek.com/v1}"
      GRAPHITI_LLM_MODEL: "${GRAPHITI_LLM_MODEL:-deepseek-chat}"
      GRAPHITI_EMBED_BASE_URL: "${GRAPHITI_EMBED_BASE_URL:-https://api.siliconflow.cn/v1}"
      GRAPHITI_EMBED_MODEL: "${GRAPHITI_EMBED_MODEL:-BAAI/bge-m3}"
      GRAPHITI_MAX_COROUTINES: "${GRAPHITI_MAX_COROUTINES:-6}"
      GRAPHITI_TELEMETRY_ENABLED: "${GRAPHITI_TELEMETRY_ENABLED:-false}"
      SEMAPHORE_LIMIT: "${SEMAPHORE_LIMIT:-6}"
      TZ: "Asia/Shanghai"
    volumes:
      - tls_app_data:/app/data
      - tls_runtime_memory:/app/memory/runtime
      - ./data/semantic_router:/app/data/semantic_router:ro
      - ./.env:/app/.env:ro
      - type: bind
        source: ${TLS_KAOYAN_EXPERIENCE_HOST_PATH:-./data/docker-empty}
        target: /app/external/kaoyan_experience
        read_only: true
    healthcheck:
      test:
        [
          "CMD",
          "/usr/local/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  tls_app_data:
    name: true-learning-system_tls_app_data
    external: true
  tls_runtime_memory:
    name: true-learning-system_tls_runtime_memory
  neo4j_data:
  postgres_data:
